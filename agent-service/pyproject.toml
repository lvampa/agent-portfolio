[project]
name = "agent-service"
version = "0.1.0"
description = "FastAPI and LangGraph agent service for the portfolio chat"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.165.0",
    "langchain-google-genai>=4.5.2",
    "langchain-pinecone>=0.2.13",
    "langgraph>=1.2.24",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "pydantic-settings>=2.16.3",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.uv]
required-version = ">=0.10.4,<0.11"

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]
