name: Frontend checks

on:
  workflow_call:
    inputs:
      chat-webhook-url:
        type: string
        default: https://example.invalid/webhook/chat
      info-url:
        type: string
        default: https://example.invalid/webhook/info
      artifact-name:
        description: Upload portfolio/out under this name. Empty skips the upload.
        type: string
        default: ""

# Runners are pinned to ubuntu-26.04 while ubuntu-latest moves to it (actions/runner-images#14748, done by 2026-11-19).
jobs:
  # One job on purpose: each check takes seconds, so parallel jobs would cost more in repeated checkout and npm ci than they save.
  checks:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: portfolio
    env:
      NEXT_PUBLIC_CHAT_WEBHOOK_URL: ${{ inputs.chat-webhook-url }}
      NEXT_PUBLIC_INFO_URL: ${{ inputs.info-url }}
    steps:
      - name: Require build URLs
        working-directory: .
        run: |
          missing=0
          for name in NEXT_PUBLIC_CHAT_WEBHOOK_URL NEXT_PUBLIC_INFO_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is empty. Set the repository variable of the same name."
              missing=1
            fi
          done
          exit "$missing"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: portfolio/package-lock.json

      - name: Install
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test

      # No .next/cache: a cold static export build takes about 8 s and a warm one about 6 s, which a cache restore and save would eat.
      - name: Build
        run: npm run build

      - name: Check the URLs were inlined
        run: |
          for url in "$NEXT_PUBLIC_CHAT_WEBHOOK_URL" "$NEXT_PUBLIC_INFO_URL"; do
            if ! grep -rqF -- "$url" out; then
              echo "::error::$url not found in portfolio/out."
              exit 1
            fi
          done

      - name: Upload site
        if: inputs.artifact-name != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-name }}
          path: portfolio/out
          if-no-files-found: error
          retention-days: 1
