name: Deploy frontend to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'portfolio/**'
      - '.github/workflows/deploy-frontend.yml'
      - '.github/workflows/frontend-checks.yml'
  workflow_dispatch:

# Queue deploys instead of cancelling, so a running deploy is never cut off halfway.
concurrency:
  group: deploy-frontend-production
  cancel-in-progress: false

permissions: {}

# Runners are pinned to ubuntu-26.04 while ubuntu-latest moves to it (actions/runner-images#14748, done by 2026-11-19).
jobs:
  # The checks job also does the real build and uploads it, which saves a second checkout, npm ci and build.
  # That is safe because the job gets only public repository variables: no environment, no secrets.
  # The Cloudflare token exists only in the deploy job, which never runs npm ci or any repo code.
  checks:
    uses: ./.github/workflows/frontend-checks.yml
    permissions:
      contents: read
    with:
      chat-webhook-url: ${{ vars.NEXT_PUBLIC_CHAT_WEBHOOK_URL }}
      info-url: ${{ vars.NEXT_PUBLIC_INFO_URL }}
      artifact-name: site

  deploy:
    needs: checks
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    environment:
      name: production
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - name: Require deploy variables
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          missing=0
          for name in CLOUDFLARE_ACCOUNT_ID CF_PAGES_PROJECT SITE_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is empty. Set the repository variable of the same name."
              missing=1
            fi
          done
          exit "$missing"

      - name: Download site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: out

      # No checkout: with no lockfile in the working directory, the action installs wrangler with plain npm.
      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.158.0"
          command: pages deploy out --project-name=${{ vars.CF_PAGES_PROJECT }} --branch=main --commit-hash=${{ github.sha }}

      - name: Write job summary
        env:
          SHA: ${{ github.sha }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          DEPLOYMENT_ID: ${{ steps.deploy.outputs.pages-deployment-id }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          {
            echo "### Deployed to Cloudflare Pages"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | \`$SHA\` |"
            echo "| Deployment | $DEPLOYMENT_URL |"
            echo "| Site | $SITE_URL |"
            echo "| Pages deployment ID | \`$DEPLOYMENT_ID\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke check
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          check() {
            for attempt in 1 2 3 4 5 6; do
              if body=$(curl -fsSL --max-time 10 "$1") && grep -qF '</html>' <<< "$body"; then
                echo "OK: $1"
                return 0
              fi
              echo "Attempt $attempt failed for $1, retrying."
              sleep 10
            done
            echo "::error::$1 did not return an HTML page."
            return 1
          }
          check "$DEPLOYMENT_URL"
          check "$SITE_URL"
