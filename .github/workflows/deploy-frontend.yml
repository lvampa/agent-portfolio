name: Deploy frontend to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'portfolio/**'
      - '.github/workflows/deploy-frontend.yml'

concurrency:
  group: deploy-frontend-production
  cancel-in-progress: false

permissions: {}

jobs:
  # No secrets here, so npm install scripts never see the Cloudflare token.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: portfolio
    env:
      NEXT_PUBLIC_CHAT_WEBHOOK_URL: ${{ vars.NEXT_PUBLIC_CHAT_WEBHOOK_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: portfolio/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: portfolio/out
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    environment:
      name: production
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - name: Require deploy variables
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          missing=0
          for name in CLOUDFLARE_ACCOUNT_ID CF_PAGES_PROJECT SITE_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is empty. Set the repository variable of the same name."
              missing=1
            fi
          done
          exit "$missing"

      - name: Download site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: out

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.158.0"
          command: pages deploy out --project-name=${{ vars.CF_PAGES_PROJECT }} --branch=main --commit-hash=${{ github.sha }}

      # If the Pages project's production branch is not main, the deploy lands as a preview and the site keeps the old build.
      - name: Require a production deploy
        env:
          PAGES_ENVIRONMENT: ${{ steps.deploy.outputs.pages-environment }}
        run: |
          if [ "$PAGES_ENVIRONMENT" != "production" ]; then
            echo "::error::Deployed to '$PAGES_ENVIRONMENT', not production. Set the Pages project's production branch to main."
            exit 1
          fi

      - name: Write job summary
        env:
          SHA: ${{ github.sha }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          DEPLOYMENT_ID: ${{ steps.deploy.outputs.pages-deployment-id }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          {
            echo "### Deployed to Cloudflare Pages"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | \`$SHA\` |"
            echo "| Deployment | $DEPLOYMENT_URL |"
            echo "| Site | $SITE_URL |"
            echo "| Pages deployment ID | \`$DEPLOYMENT_ID\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke check
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          is_html() { grep -qF '</html>'; }
          is_info() { jq -e '.timestamp' > /dev/null; }
          check() {
            for attempt in 1 2 3 4 5 6; do
              if body=$(curl -fsSL --max-time 10 "$1") && "$2" <<< "$body"; then
                echo "OK: $1"
                return 0
              fi
              echo "Attempt $attempt failed for $1, retrying."
              sleep 10
            done
            echo "::error::$1 did not return the expected response ($2 failed)."
            return 1
          }
          # The pages.dev deployment URL has no Worker route, so /info is only checked on the site.
          check "$DEPLOYMENT_URL" is_html
          check "$SITE_URL" is_html
          check "$SITE_URL/info" is_info
