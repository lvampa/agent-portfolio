name: CI

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

# Back to ubuntu-latest once it points at 26.04 (actions/runner-images#14748).
jobs:
  frontend:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: portfolio
    env:
      NEXT_PUBLIC_CHAT_WEBHOOK_URL: https://example.invalid/webhook/chat
      NEXT_PUBLIC_INFO_URL: https://example.invalid/webhook/info
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: portfolio/package-lock.json

      - name: Install
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  infra:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: "1.13.x"

      - name: Format check
        run: tofu fmt -check -recursive

      - name: Init
        run: tofu init -backend=false -input=false

      - name: Validate
        run: tofu validate

      - name: Test
        run: tofu test

      - name: Init bootstrap
        run: tofu -chdir=bootstrap init -backend=false -input=false

      - name: Validate bootstrap
        run: tofu -chdir=bootstrap validate

  # The only required check.
  ci:
    name: ci
    if: always()
    needs: [frontend, infra]
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    steps:
      - name: Fail if any job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
