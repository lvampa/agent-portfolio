name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Runners are pinned to ubuntu-26.04 while ubuntu-latest moves to it (actions/runner-images#14748, done by 2026-11-19).
jobs:
  changes:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      # On pull_request, paths-filter lists files through the API and needs no checkout.
      - name: Checkout
        if: github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect changed areas
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            frontend:
              - 'portfolio/**'
              - '.github/workflows/frontend-checks.yml'
              - '.github/workflows/ci.yml'
            infra:
              - 'infra/**'
              - '.github/workflows/ci.yml'

  frontend:
    needs: changes
    # On push to main, deploy-frontend.yml runs the same checks before deploying, so running them here too would be a duplicate.
    if: needs.changes.outputs.frontend == 'true' && github.event_name == 'pull_request'
    uses: ./.github/workflows/frontend-checks.yml
    permissions:
      contents: read

  infra:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: "1.13.x"
          tofu_wrapper: false

      - name: Prepare plugin cache
        run: |
          mkdir -p "$RUNNER_TEMP/tofu-plugins"
          echo "TF_PLUGIN_CACHE_DIR=$RUNNER_TEMP/tofu-plugins" >> "$GITHUB_ENV"

      - name: Cache providers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/tofu-plugins
          key: tofu-plugins-${{ runner.os }}-${{ hashFiles('infra/.terraform.lock.hcl', 'infra/bootstrap/.terraform.lock.hcl') }}

      - name: Format check
        run: tofu fmt -check -recursive

      - name: Init
        run: tofu init -backend=false -input=false

      - name: Validate
        run: tofu validate

      - name: Test
        run: tofu test

      - name: Init bootstrap
        run: tofu -chdir=bootstrap init -backend=false -input=false

      - name: Validate bootstrap
        run: tofu -chdir=bootstrap validate

  # The single required status check.
  # A job skipped by its if reports success, so this passes when an area did not change.
  ci:
    name: ci
    if: always()
    needs: [changes, frontend, infra]
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    steps:
      - name: Fail if any job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
